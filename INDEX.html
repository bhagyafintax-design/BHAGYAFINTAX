<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gift Tax Calculator India | Bhagya Fintax</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #e6f0f3, #f9fbfc);
  padding: 30px;
}

.container {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.brand {
  text-align: center;
  margin-bottom: 15px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #0a6c74;
}

.tagline {
  font-size: 12px;
  color: #666;
}

h2 {
  color: #0a6c74;
  margin-top: 15px;
}

label {
  font-weight: 500;
}

input, select {
  width: 100%;
  padding: 11px;
  margin: 8px 0 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #0a6c74, #0f8b94);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

.result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  font-weight: bold;
}

.exempt { background: #e6f7ee; color: #1e7e34; }
.taxable { background: #fdecea; color: #b02a37; }

.whatsapp {
  display: block;
  margin-top: 15px;
  text-align: center;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 500;
}

.footer {
  margin-top: 15px;
  font-size: 12px;
  color: #777;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="logo">BHAGYA FINTAX</div>
    <div class="tagline">Your Trusted Partner in Tax & Finance Excellence</div>
  </div>

  <h2>Gift Tax Calculator</h2>

  <label>Gift Type:</label>
  <select id="giftType">
    <option value="cash">Cash / Movable</option>
    <option value="property">Immovable Property</option>
  </select>

  <label>Gift Value (₹):</label>
  <input type="number" id="amount">

  <div id="propertyFields" style="display:none;">
    <label>Stamp Duty Value (₹):</label>
    <input type="number" id="stampValue">
  </div>

  <label>Relation:</label>
  <select id="relation">
    <option value="spouse">Spouse</option>
    <option value="brother">Brother</option>
    <option value="sister">Sister</option>
    <option value="parent">Parent/Grandparent</option>
    <option value="child">Child/Grandchild</option>
    <option value="relative_other">Other Relative</option>
    <option value="spouse_relative">Spouse of above relatives</option>
    <option value="non_relative">Non-Relative</option>
  </select>

  <label>Occasion:</label>
  <select id="occasion">
    <option value="normal">Normal</option>
    <option value="marriage">Marriage</option>
    <option value="inheritance">Inheritance/Will</option>
  </select>

  <button onclick="checkTax()">Check Taxability</button>

  <div id="resultBox" class="result" style="display:none;"></div>

  <a id="whatsappBtn" class="whatsapp" target="_blank" style="display:none;">
    Get Expert Advice on WhatsApp
  </a>

  <div class="footer">
    Based on Section 56(2)(x) | Bhagya Fintax | 9674672499
  </div>

</div>

<script>
document.getElementById("giftType").addEventListener("change", function() {
  document.getElementById("propertyFields").style.display =
    this.value === "property" ? "block" : "none";
});

function checkTax() {
  let amount = parseFloat(document.getElementById("amount").value || 0);
  let relation = document.getElementById("relation").value;
  let occasion = document.getElementById("occasion").value;
  let giftType = document.getElementById("giftType").value;
  let stampValue = parseFloat(document.getElementById("stampValue").value || 0);

  let isRelative = relation !== "non_relative";
  let resultText = "";
  let className = "";

  if (isRelative) {
    resultText = "EXEMPT – Gift from relative";
    className = "exempt";
  } 
  else if (occasion === "marriage") {
    resultText = "EXEMPT – Gift received on marriage";
    className = "exempt";
  } 
  else if (occasion === "inheritance") {
    resultText = "EXEMPT – Received through inheritance/will";
    className = "exempt";
  } 
  else {
    if (giftType === "cash") {
      if (amount <= 50000) {
        resultText = "EXEMPT – Value below ₹50,000";
        className = "exempt";
      } else {
        resultText = "TAXABLE – Amount exceeds ₹50,000";
        className = "taxable";
      }
    } 
    else if (giftType === "property") {
      if (stampValue > 50000) {
        resultText = "TAXABLE – Stamp duty value taxable";
        className = "taxable";
      } else {
        resultText = "EXEMPT – Value below threshold";
        className = "exempt";
      }
    }
  }

  let box = document.getElementById("resultBox");
  box.style.display = "block";
  box.className = "result " + className;
  box.innerHTML = resultText;

  let msg = encodeURIComponent(
    "Hi, I checked gift tax using your tool. Result: " + resultText + ". Please guide me."
  );

  let link = "https://wa.me/919674672499?text=" + msg;

  let btn = document.getElementById("whatsappBtn");
  btn.style.display = "block";
  btn.href = link;
}
</script>

</body>
</html>
